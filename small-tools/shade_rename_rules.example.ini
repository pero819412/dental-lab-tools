; shade_name_converter.py 用ルールの見本（書式説明用の一部のみ。値は自分のラボの運用に合わせて作ること）
; 使うときは shade_rename_rules.ini にリネームするか、環境変数 SHADE_RENAME_RULES でパスを指定する。
;
; 1) [guide_to_vita]   入力されたガイド表記 → VITA classical へ揃える
; 2) [shift_materials] 直前にこの材料記号があれば [shift_output] を使う（値は何でもよい）
; 3) [shift_output] / [nonshift_output]  揃えた VITA 表記 → 最終的にファイル名へ書く表記
; 値が Bright/Light の項目は自動変換せず、呼び出し側に手動選択を促す（manual_choice=True）。

[guide_to_vita]
1M1=A1
2M2=A2
3M2=A2
3M3=A3
2L1.5=A1
0M1=Bright/Light

[shift_materials]
MAT1=1
MAT2=1

[shift_output]
B2=A2-B2
C2=A2-C2

[nonshift_output]
B2=A2
C2=A3
